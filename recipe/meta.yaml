{% set name = "geoagent" %}
{% set version = "1.8.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/geoagent-{{ version }}.tar.gz
  sha256: b0c4498298b0d12cb967b3e23da3f347bbec8d7c186709e3e39499370bbb2c7e

build:
  noarch: python
  entry_points:
    - geoagent = geoagent.cli:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - pydantic>=2.0
    - pytest>=8.0
    - ruff>=0.7
    - strands-agents>=1.37
    - strands-agents-tools >=0.5.1
    - openai
    - anthropic
    - google-genai
    - ollama
    - leafmap
    - geemap
    - pystac-client
    - planetary-computer
    - earthaccess
    - fastapi

test:
  imports:
    - geoagent
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/opengeos/GeoAgent
  summary: An AI agent for geospatial data analysis and visualization
  description: An AI agent for geospatial data analysis and visualization
  license: MIT
  license_file: LICENSE
  doc_url: https://geoagent.gishub.org
  dev_url: https://github.com/opengeos/GeoAgent

extra:
  recipe-maintainers:
    - giswqs
